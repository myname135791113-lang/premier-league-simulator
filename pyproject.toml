[project]
name = "sim"
version = "0.1.0"
description = "Premier League match prediction simulator"
requires-python = ">=3.12"
dependencies = ["pandas", "numpy", "scipy", "statsmodels", "requests", "pyyaml", "fastapi", "uvicorn[standard]"]

[project.optional-dependencies]
dev = ["pytest", "httpx2", "pillow"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
